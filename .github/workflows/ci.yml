name: ci

on:
  push:
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 发布红线泄露扫描
        run: bash scripts/leak-scan.sh

      - name: bash 语法检查
        run: |
          for f in bin/*.sh scripts/*.sh; do
            bash -n "$f"
          done

      - name: python 编译检查
        run: python3 -m py_compile scripts/*.py

      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          shellcheck bin/*.sh scripts/*.sh
